<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#b4960a" />

    <!--
      Logo navbar = elemen LCP di ponsel. Preload supaya unduhannya mulai
      begitu <head> dibaca, tidak menunggu parser sampai ke <header>.
      Yang di-preload versi .webp karena itulah yang dipilih <picture> di
      SmartImage untuk semua browser modern.
    -->
    <link rel="preload" as="image" href="/logo-nav.webp" type="image/webp" fetchpriority="high" />
    <!--
      Ornamen kayon di hero juga kandidat LCP di ponsel (dipakai di hero
      Beranda, halaman koleksi, Katalog, Tentang, Kontak). Tanpa preload,
      unduhannya baru mulai setelah parser sampai ke hero. media= memastikan
      desktop tidak ikut mengunduh versi kecil yang tidak akan dipakainya.
    -->
    <link rel="preload" as="image" href="/kayon-sm.webp" type="image/webp" media="(max-width: 1023px)" fetchpriority="high" />
    <!--
      Font tidak lagi dari Google Fonts: sekarang di-host sendiri lewat
      @fontsource (lihat src/main.jsx), jadi tidak ada koneksi tambahan ke
      fonts.googleapis.com + fonts.gstatic.com di jalur render.
    -->
    <!--
      Sengaja TIDAK ada tag title / meta description statis di sini: setiap
      route merender komponen Seo (src/components/Seo.jsx) via react-helmet-async,
      yang menyisipkan tag-nya sendiri, bukan mengganti yang sudah ada. Default
      yang ditulis di sini akan ikut terkirim sebagai duplikat permanen di
      HTML hasil prerender.

      Jangan tulis nama tag lengkap dengan kurung sudut di komentar ini.
      Parser SEO yang naif (SEOptimer, Sep 2026) membaca tag di dalam komentar
      sebagai title asli dan melaporkan teks komentar ini sebagai judul situs.
    -->
    <!--
      Google Tag Manager, DITUNDA.

      gtm.js 139 KiB dan ~92 KiB-nya tidak terpakai saat halaman pertama
      dibuka (PageSpeed, Sep 2026). Dimuat langsung di <head>, ia ikut
      berebut bandwidth dan main thread tepat di jendela FCP/LCP.

      Sekarang GTM dimuat pada yang PERTAMA terjadi dari:
        1. interaksi pertama pengunjung (sentuh, klik, scroll, ketik), atau
        2. 4 detik setelah halaman selesai load, atau
        3. LANGSUNG, kalau URL membawa gclid / gbraid / wbraid / utm_*.

      Poin 3 penting: pengunjung dari iklan Google Ads harus dapat GTM
      secepatnya, supaya Conversion Linker sempat membaca gclid dari URL
      sebelum pengunjung pindah halaman di dalam SPA (URL-nya berubah dan
      gclid hilang). Jadi atribusi konversi iklan tidak dikorbankan.

      Event yang di-push ke dataLayer sebelum GTM termuat (page_view,
      whatsapp_click, booking_submit) TIDAK hilang: GTM memproses antrean
      dataLayer yang sudah ada begitu ia jalan. Tombol WhatsApp membuka tab
      baru (target=_blank), jadi halaman ini tetap hidup sampai GTM selesai
      mengirim konversinya.
    -->
    <script>
      (function (w, d, id) {
        w.dataLayer = w.dataLayer || [];
        var dimuat = false;
        var EVENT = ['pointerdown', 'touchstart', 'keydown', 'scroll'];
        function muat() {
          if (dimuat) return;
          dimuat = true;
          EVENT.forEach(function (e) { w.removeEventListener(e, muat, true); });
          w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var j = d.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + id;
          d.head.appendChild(j);
        }
        if (/[?&](gclid|gbraid|wbraid|utm_[a-z]+)=/.test(w.location.search)) return muat();
        EVENT.forEach(function (e) { w.addEventListener(e, muat, { capture: true, passive: true }); });
        w.addEventListener('load', function () { setTimeout(muat, 4000); });
      })(window, document, '%VITE_GTM_ID%');
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!--
      The spinner is the "shell": what a visitor sees on a page that has no
      prerendered HTML (/booking/:id, /status/:kode, /admin/*, 404s) until
      the JS arrives. data-shell tells main.jsx to client-render over it
      instead of hydrating. Prerendered pages never contain it: the crawl
      client-renders over it too, so the snapshot holds the real page.
      Same markup as src/components/ui/Spinner.jsx, plus flex-1 to centre it.
    -->
    <div id="root"><div data-shell role="status" aria-label="Memuat halaman" class="flex flex-1 items-center justify-center py-16"><span class="h-8 w-8 animate-spin rounded-full border-4 border-blue-100 border-t-blue-600"></span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
