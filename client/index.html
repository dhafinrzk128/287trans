<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#b4960a" />

    <!--
      Fonts moved here from an @import in index.css: @import is
      render-blocking and isn't discovered until the CSS that contains it
      has already been fetched and parsed, unlike a <link> the browser's
      preload scanner finds immediately. display=swap in the URL is passed
      through to the @font-face rules Google Fonts returns.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <!--
      Loaded non-blocking: media="print" makes the browser fetch it without
      letting it gate initial render, then onload flips it to "all" once it's
      actually parsed. display=swap in the URL means text still renders
      immediately in a fallback font either way — this just removes the ~1s
      this request was otherwise adding to LCP by sitting in the render-
      blocking path for no visual benefit. <noscript> covers the no-JS case.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <!--
      No static <title>/<meta name="description"> here on purpose: every
      route renders <Seo> (see src/components/Seo.jsx) via react-helmet-async,
      which inserts its own tags rather than replacing existing ones. A
      hardcoded default here would ship as a permanent duplicate alongside
      each page's real title/description in the prerendered HTML.
    -->
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','%VITE_GTM_ID%');</script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!--
      The spinner is the "shell": what a visitor sees on a page that has no
      prerendered HTML (/booking/:id, /status/:kode, /admin/*, 404s) until
      the JS arrives. data-shell tells main.jsx to client-render over it
      instead of hydrating. Prerendered pages never contain it: the crawl
      client-renders over it too, so the snapshot holds the real page.
      Same markup as src/components/ui/Spinner.jsx, plus flex-1 to centre it.
    -->
    <div id="root"><div data-shell role="status" aria-label="Memuat halaman" class="flex flex-1 items-center justify-center py-16"><span class="h-8 w-8 animate-spin rounded-full border-4 border-blue-100 border-t-blue-600"></span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
